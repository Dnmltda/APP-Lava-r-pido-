# DNM&LTDA Lava Rápido no Fly.io (São Paulo).
# O nome do app pode ser trocado pela variável FLY_APP do repositório (ver DEPLOY.md).
app = "dnm-lava-rapido"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[[mounts]]
  source = "pb_data"
  destination = "/pb/pb_data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
